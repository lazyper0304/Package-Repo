server {
    listen 80;
    listen [::]:80;
    listen 5174;
    listen [::]:5174;
    server_name test.ybxylazycats.dpdns.org;

    root /vol1/1panel/www/sites/test.ybxylazycats.dpdns.org/index;
    index index.html;

    # API 代理
    location ^~ /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 主工具站
    location = / {
        try_files /site/index.html =404;
    }

    # Package Repo - 内部重写 /repo 到 /repo/
    location = /repo {
        rewrite ^ /repo/ last;
    }

    location ^~ /repo/ {
        try_files $uri $uri/ /repo/index.html;
    }

    # 闲鱼水印工具
    location = /fish {
        try_files /fish/index.html =404;
    }

    location ^~ /fish/ {
        try_files $uri $uri/ /fish/index.html;
    }

    # 从夯到拉
    location = /tier {
        rewrite ^ /tier/ last;
    }

    location ^~ /tier/ {
        try_files $uri $uri/ /tier/index.html;
    }

    # 图片矢量化工具
    location = /vectorizer {
        rewrite ^ /vectorizer/ last;
    }

    location ^~ /vectorizer/ {
        try_files $uri $uri/ /vectorizer/index.html;
    }

    # 图片尺寸格式工具
    location = /imgtool {
        rewrite ^ /imgtool/ last;
    }

    location ^~ /imgtool/ {
        try_files $uri $uri/ /imgtool/index.html;
    }

    # 2048游戏
    location = /game2048 {
        rewrite ^ /game2048/ last;
    }

    location ^~ /game2048/ {
        try_files $uri $uri/ /game2048/index.html;
    }

    # 数独游戏
    location = /sudoku {
        rewrite ^ /sudoku/ last;
    }

    location ^~ /sudoku/ {
        try_files $uri $uri/ /sudoku/index.html;
    }

    # 弹球游戏
    location = /pinball {
        rewrite ^ /pinball/ last;
    }

    location ^~ /pinball/ {
        try_files $uri $uri/ /pinball/index.html;
    }

    # 安全规则
    location ~ ^/\.htaccess {
        return 403;
    }

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    error_page 404 /404.html;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
}

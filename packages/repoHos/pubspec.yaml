name: repo_hos
description: 鸿蒙版应用包名查询工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  signals: ^5.5.0
  signals_flutter: ^5.5.0
  dio: ^5.7.0
  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  intl: ^0.19.0
  liquid_glass_widgets: ^0.15.0
  animated_gradient: ^0.0.3

dependency_overrides:
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/
